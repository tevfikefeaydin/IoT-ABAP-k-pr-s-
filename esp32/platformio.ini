; PlatformIO project for the ESP32 → ABAP IoT bridge
; Build & flash:  pio run -t upload && pio device monitor
;
; Board: generic ESP32 dev module (WROOM-32). Change `board` if you use a
; different variant (e.g. esp32-s3-devkitc-1).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies (pinned to major versions for reproducible builds)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Optional build flags
build_flags =
    -D CORE_DEBUG_LEVEL=1
