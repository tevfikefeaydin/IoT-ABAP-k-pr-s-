; PlatformIO project for the ESP32 → ABAP IoT bridge
;
; The sensor is chosen by which environment you build. Examples:
;   pio run -e esp32-dht22   -t upload   # DHT22   (temp + humidity, default)
;   pio run -e esp32-sht31   -t upload   # SHT31   (temp + humidity, I2C, cold-room grade)
;   pio run -e esp32-ds18b20 -t upload   # DS18B20 (temp only, waterproof probe)
;   pio device monitor
;
; Board: generic ESP32 dev module (WROOM-32). Change `board` if you use a
; different variant (e.g. esp32-s3-devkitc-1).

[platformio]
default_envs = esp32-dht22

; ---- shared library base ---------------------------------------------------
[common]
base_libs =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ---- settings common to every environment ----------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -D CORE_DEBUG_LEVEL=1

; ---- DHT22 (default) -------------------------------------------------------
[env:esp32-dht22]
build_flags =
    ${env.build_flags}
    -D SENSOR_DHT22
lib_deps =
    ${common.base_libs}
    adafruit/DHT sensor library @ ^1.4.6

; ---- SHT31 (I2C) -----------------------------------------------------------
[env:esp32-sht31]
build_flags =
    ${env.build_flags}
    -D SENSOR_SHT31
lib_deps =
    ${common.base_libs}
    adafruit/Adafruit SHT31 Library @ ^2.2.2

; ---- DS18B20 (1-Wire) ------------------------------------------------------
[env:esp32-ds18b20]
build_flags =
    ${env.build_flags}
    -D SENSOR_DS18B20
lib_deps =
    ${common.base_libs}
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
